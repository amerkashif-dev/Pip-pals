<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pip Pals">
<meta name="theme-color" content="#ff5fa2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="A gentle offline virtual-pet adventure with 2.5D storybook pets, expressive voices, picture games and sticker surprises.">
<title>Pip Pals • Little Adventures</title>
<style>
:root{--ink:#3a2230;--bg:#fff4fa;--accent:#ff5fa2;--accent2:#7c5cff;--good:#3fcf8e;--warn:#ff7a59}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#2b1d3a;font-family:"Avenir Next","Nunito",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;color:var(--ink);overscroll-behavior:none;touch-action:manipulation;overflow:hidden}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
input,select,textarea{font-family:inherit;font-size:18px;-webkit-user-select:text;user-select:text}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--bg);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);overflow:hidden}
.screen{display:none;flex:1;flex-direction:column;min-height:0}
.screen.on{display:flex}

/* ---------- home ---------- */
#home{background:radial-gradient(circle at 30% 10%,#ffe0f0,#ffd0ea 40%,#e7d6ff);padding:18px 16px;overflow-y:auto}
.logo{text-align:center;font-size:42px;font-weight:900;letter-spacing:1px;color:#fff;text-shadow:0 3px 0 #ff5fa2,0 6px 0 #7c5cff,0 8px 14px rgba(0,0,0,.2);margin:8px 0 2px}
.sub{text-align:center;font-weight:800;color:#8a4f74;margin-bottom:14px;font-size:17px}
.players{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pcard{background:#fff;border-radius:26px;padding:10px 8px 14px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.08);border:4px solid var(--pc,#ff5fa2);min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .15s}
.pcard:active{transform:scale(.97)}
.pcard .mini{width:124px;height:124px}
.pcard .pn{font-size:22px;font-weight:900;color:var(--pc)}
.pcard .pp{font-size:15px;font-weight:700;opacity:.75}
.pcard.add{border-style:dashed;border-color:#c7a8e8;color:#9a6fc8;font-size:20px;font-weight:900;background:rgba(255,255,255,.6)}
.pcard.add .plus{font-size:56px;line-height:1}
.homeFoot{display:flex;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.grownBtn{background:rgba(255,255,255,.8);padding:12px 18px;border-radius:16px;font-weight:800;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.06)}

/* ---------- game ---------- */
.top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.06);z-index:5}
.ib{width:48px;height:48px;border-radius:16px;background:#ffe3f1;font-size:24px;display:flex;align-items:center;justify-content:center;flex:none}
.tname{flex:1;min-width:0;text-align:center;line-height:1.1}
.tname b{font-size:21px;font-weight:900;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tname span{font-size:13px;font-weight:800;opacity:.65}
.coins{background:#fff3c4;border-radius:16px;padding:0 12px;height:48px;display:flex;align-items:center;font-weight:900;font-size:19px;gap:4px;flex:none}
.room{flex:1;position:relative;overflow:hidden;min-height:200px;perspective:900px}
.sky,.floor{position:absolute;left:-4%;right:-4%;transition:transform .25s ease-out}
.sky{top:-4%;bottom:22%}
.floor{bottom:-2%;height:26%;box-shadow:inset 0 8px 0 rgba(0,0,0,.07);border-top:3px solid rgba(255,255,255,.45)}
.roomLight{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 34%,rgba(255,255,255,.32),transparent 65%);z-index:1}
.deco{position:absolute;pointer-events:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.14));transition:transform .3s ease-out}
.seasonTag{position:absolute;right:12px;bottom:25%;font-size:28px;pointer-events:none;z-index:2;filter:drop-shadow(0 2px 4px rgba(0,0,0,.15));animation:bob 3.2s ease-in-out infinite}

/* 2.5D Pet Rig */
#petWrap{position:absolute;bottom:6%;left:50%;width:min(62vw,275px);aspect-ratio:1;transform:translateX(-50%);transition:left 2.2s ease-in-out;z-index:3;touch-action:none}
#petFlip{width:100%;height:100%;transition:transform .28s cubic-bezier(.34,1.56,.64,1);transform-style:preserve-3d}
#pet{width:100%;height:100%;animation:bob 2.2s ease-in-out infinite;transform-origin:50% 94%;will-change:transform}
#pet svg,.mini svg,.bookPet svg,.lrPet svg{width:100%;height:100%;display:block;overflow:visible}
#pet.walk{animation:hop .46s cubic-bezier(.45,.05,.55,.95) infinite}
#pet.asleep{animation:breathe 3.4s ease-in-out infinite}
#pet.egg{animation:eggidle 2.4s ease-in-out infinite}
#pet.wobble{animation:wobble .45s ease-in-out}
#pet.shake{animation:shakeNo .5s ease-in-out}
#pet.jump{animation:jump .65s cubic-bezier(.22,1,.36,1)}
#pet.hug{animation:squish .68s cubic-bezier(.34,1.56,.64,1)}
#pet.dance{animation:dance .55s ease-in-out infinite}
@keyframes bob{0%,100%{transform:scale(1,1) translateY(0)}50%{transform:scale(1.035,.965) translateY(2px)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.045,.955)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.06,.93)}45%{transform:translateY(-11%) scale(.95,1.06)}}
@keyframes eggidle{0%,100%{transform:rotate(0) scale(1,1)}10%{transform:rotate(-5deg) scale(1.02,.98)}20%{transform:rotate(5deg) scale(.98,1.02)}30%{transform:rotate(0) scale(1,1)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-13deg) scale(1.03,.97)}75%{transform:rotate(13deg) scale(.97,1.03)}}
@keyframes shakeNo{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8%)}40%,80%{transform:translateX(8%)}}
@keyframes jump{0%{transform:translateY(0) scale(1.08,.9)}38%{transform:translateY(-24%) scale(.93,1.08)}72%{transform:translateY(0) scale(1.08,.92)}100%{transform:none}}
@keyframes squish{0%,100%{transform:scale(1,1)}28%{transform:scale(1.18,.82)}58%{transform:scale(.91,1.11)}}
@keyframes dance{0%,100%{transform:rotate(-8deg) translateY(0) scale(1.04,.96)}50%{transform:rotate(8deg) translateY(-10%) scale(.96,1.05)}}
.blink{animation:blink 4.4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.06)}}
.tw{animation:tw 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.tw2{animation-delay:.8s}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.6) rotate(0deg)}50%{opacity:1;transform:scale(1.15) rotate(25deg)}}
.tear{animation:tear 1.6s ease-in infinite}
@keyframes tear{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
.chomp{animation:chomp .3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes chomp{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.2)}}
.floatWing{animation:flap 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes flap{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-10deg)}}

.think{position:absolute;left:64%;top:-12%;background:#fff;border-radius:50%;width:64px;height:64px;display:none;align-items:center;justify-content:center;font-size:34px;box-shadow:0 5px 0 rgba(0,0,0,.1);animation:pulse 1.2s ease-in-out infinite;z-index:4}
.think:after{content:"";position:absolute;left:4px;bottom:-6px;width:16px;height:16px;background:#fff;border-radius:50%}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.speech{position:absolute;left:50%;top:-18%;transform:translateX(-50%);background:#fff;border-radius:18px;padding:8px 14px;font-weight:900;font-size:19px;white-space:nowrap;box-shadow:0 5px 0 rgba(0,0,0,.12);display:none;z-index:5}
.zzz{position:absolute;left:66%;top:6%;font-size:26px;font-weight:900;color:#7c5cff;display:none;z-index:4}
.zzz i{position:absolute;font-style:normal;animation:zz 2.4s linear infinite;opacity:0}
.zzz i:nth-child(2){animation-delay:.8s}.zzz i:nth-child(3){animation-delay:1.6s}
@keyframes zz{0%{transform:translate(0,0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translate(26px,-60px) scale(1.3);opacity:0}}

.poop{position:absolute;bottom:6%;font-size:44px;background:none;padding:4px;z-index:2;animation:poopIn .5s ease-out}
.poop:before{content:"〰️";position:absolute;top:-22px;left:10px;font-size:20px;opacity:.6;animation:stink 1.5s ease-in-out infinite}
@keyframes stink{0%,100%{transform:translateY(0);opacity:.2}50%{transform:translateY(-6px);opacity:.7}}
@keyframes poopIn{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.fx{position:absolute;font-size:30px;animation:floatUp 1.3s ease-out forwards;pointer-events:none}
@keyframes floatUp{0%{transform:translate(-50%,0) scale(.5);opacity:0}20%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{transform:translate(-50%,-110px) scale(1);opacity:0}}
.bub{position:absolute;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,rgba(190,230,255,.6) 60%,rgba(140,200,255,.5));border:2px solid rgba(255,255,255,.9);transform:translate(-50%,-50%);animation:bubIn .3s ease-out}
@keyframes bubIn{from{transform:translate(-50%,-50%) scale(0)}to{transform:translate(-50%,-50%) scale(1)}}
.drop{position:absolute;top:-20px;width:6px;height:16px;border-radius:3px;background:#6cc6ff;animation:rain .7s linear forwards}
@keyframes rain{to{transform:translateY(600px)}}
#night{position:absolute;inset:0;background:radial-gradient(circle at 80% 15%,rgba(40,30,90,.55),rgba(15,10,45,.78));pointer-events:none;opacity:0;transition:opacity .6s;z-index:4}
#night.on{opacity:1}
#night .moon{position:absolute;right:10%;top:7%;font-size:44px}
#night .st{position:absolute;color:#fff7c2;font-size:16px;animation:tw 2s ease-in-out infinite}
.hint{position:absolute;left:0;right:0;top:6%;text-align:center;font-size:24px;font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25),0 0 10px rgba(0,0,0,.2);z-index:7;pointer-events:none;padding:0 10px}
.floatBtn{position:absolute;z-index:8;background:#fff;border-radius:20px;padding:10px 14px;font-weight:900;font-size:18px;box-shadow:0 5px 0 rgba(0,0,0,.15);animation:pulse 1s ease-in-out infinite}
#mannersBtn{right:10px;top:68px;background:#fff3c4}
#gift{left:8%;bottom:5%;font-size:48px;background:none;box-shadow:none;padding:0;position:absolute;z-index:3;animation:wobble 1.2s ease-in-out infinite}
#bathBar{left:50%;transform:translateX(-50%);top:68px;display:none;animation:none;white-space:nowrap}
#pausedBanner{position:absolute;left:10px;right:10px;bottom:10px;z-index:8;background:rgba(255,255,255,.92);border-radius:16px;padding:10px;text-align:center;font-weight:800;display:none}
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 10px 4px;background:#fff}
.meter{display:flex;align-items:center;gap:4px}
.meter .ic{font-size:22px;width:26px;text-align:center}
.meter.low .ic{animation:shakeNo .8s ease-in-out infinite}
.bar{flex:1;height:14px;background:#f1e4ec;border-radius:8px;overflow:hidden}
.fill{height:100%;border-radius:8px;background:var(--good);transition:width .5s,background .5s}
.meter.mid .fill{background:#ffc93c}.meter.low .fill{background:#ff5d5d}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:6px 10px 10px;background:#fff}
.act{background:#fff0f7;border-radius:20px;height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;line-height:1;box-shadow:0 4px 0 #f6cfe2;transition:transform .1s}
.act small{font-size:13px;font-weight:900;margin-top:4px}
.act:active{transform:translateY(3px);box-shadow:0 1px 0 #f6cfe2}
.act.glow{background:#fff6c9;box-shadow:0 4px 0 #f1d36b;animation:pulse 1s ease-in-out infinite}
.btns.off .act{opacity:.35;pointer-events:none}

/* Top corner HUD cluster */
.hudRight{position:absolute;z-index:9;top:10px;right:10px;display:flex;gap:8px}
.hudBtn{min-height:50px;min-width:50px;border-radius:18px;background:rgba(255,255,255,.95);border:2px solid #fff;box-shadow:0 4px 0 rgba(40,20,60,.15);font-size:24px;display:flex;align-items:center;justify-content:center;padding:0 10px}
.hudBtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(40,20,60,.15)}

/* ---------- sheets & modals ---------- */
.veil{position:absolute;inset:0;background:rgba(40,20,50,.45);z-index:40;display:none}
.veil.on{display:block}
#sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:28px 28px 0 0;z-index:41;max-height:80%;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .28s ease-out;padding-bottom:env(safe-area-inset-bottom)}
#sheet.on{transform:none}
.shHead{display:flex;align-items:center;padding:12px 14px 6px;gap:10px}
.shHead h2{flex:1;margin:0;font-size:24px;font-weight:900}
.shBody{overflow-y:auto;padding:4px 14px 18px;-webkit-overflow-scrolling:touch}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.tab{padding:10px 14px;border-radius:14px;background:#f5ecf2;font-weight:900;font-size:16px;white-space:nowrap}
.tab.on{background:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{background:#fff5fa;border-radius:20px;padding:10px 4px;text-align:center;border:3px solid #ffe0ef;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.item .e{font-size:40px;line-height:1.1}
.item .n{font-size:14px;font-weight:900;margin-top:4px}
.item .pr{font-size:14px;font-weight:900;color:#b07a00;margin-top:2px}
.item .cnt{position:absolute;top:6px;right:8px;background:var(--accent);color:#fff;border-radius:10px;font-size:13px;font-weight:900;padding:1px 7px}
.item.owned{border-color:#bfeedb;background:#f2fff9}
.item.sel{border-color:var(--accent2);background:#f3efff}
.item.dim{opacity:.45}
.item svg{width:74px;height:74px}
.item.roomT .n,.item.roomT .pr{background:rgba(255,255,255,.92);border-radius:10px;padding:1px 8px}
.gameCard{display:flex;align-items:center;gap:12px;background:#f6f0ff;border-radius:20px;padding:12px;margin-bottom:10px;width:100%;text-align:left;border:3px solid #e6dbff}
.gameCard .e{font-size:42px}
.gameCard b{font-size:19px;display:block}
.gameCard span{font-size:14px;opacity:.7;font-weight:700}
.secT{font-size:17px;font-weight:900;margin:14px 0 8px;opacity:.8}
#modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);width:min(92%,440px);max-height:88%;overflow-y:auto;background:#fff;border-radius:28px;z-index:51;padding:20px 18px;text-align:center;opacity:0;pointer-events:none;transition:all .2s}
#modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
#mveil{z-index:50}
#modal h2{margin:4px 0 10px;font-size:26px;font-weight:900}
#modal p{font-size:18px;font-weight:700;margin:8px 0}
.big{background:var(--accent);color:#fff;font-weight:900;font-size:22px;border-radius:20px;padding:14px 22px;margin:6px;box-shadow:0 5px 0 #d43f82;min-width:120px}
.big.alt{background:#efe7ff;color:#5b3fc9;box-shadow:0 5px 0 #cdbef5}
.big.green{background:var(--good);box-shadow:0 5px 0 #23a06a}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.eggs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.pp3d{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;-webkit-user-drag:none}
.ppEmoji{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:56px}
.eggs .pp3d,.eggs .ppEmoji{height:96px;animation:eggidle 2.4s ease-in-out infinite}
.eggs button{background:#fff7fb;border-radius:22px;padding:6px;border:3px solid #ffe0ef}
.eggs svg{width:100%;height:96px;animation:eggidle 2.4s ease-in-out infinite}
.eggs b{display:block;font-size:13px;margin-bottom:2px;line-height:1.15}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.chip{width:48px;height:48px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 3px #eee}
.chip.on{box-shadow:0 0 0 4px var(--ink)}
.txt{width:100%;padding:14px;border-radius:16px;border:3px solid #f0d6e5;font-size:22px;font-weight:800;text-align:center;margin:8px 0}
.nameBig{font-size:38px;font-weight:900;color:var(--accent);margin:6px 0 10px;min-height:46px}
.sugg{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sugg button{background:#fff0f7;border-radius:16px;padding:12px 16px;font-size:19px;font-weight:900;border:3px solid #ffd3e8}
.mBig{width:205px;height:205px;margin:0 auto}
.mBig svg{width:100%;height:100%;overflow:visible}
.flash{position:absolute;inset:0;background:#fff;z-index:60;pointer-events:none;animation:flash .9s ease-out forwards}
@keyframes flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#3a2230;color:#fff;font-weight:800;font-size:16px;border-radius:16px;padding:10px 16px;z-index:70;max-width:90%;text-align:center;animation:toast 3.2s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.bookGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bookCell{background:#fbf6ff;border-radius:16px;padding:6px 2px;text-align:center;font-size:12px;font-weight:900}
.bookPet{width:100%;aspect-ratio:1}
.bookCell.no .bookPet{filter:brightness(0);opacity:.13}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.stat{background:#fff5fa;border-radius:14px;padding:10px;font-weight:900;font-size:16px}
.stat span{display:block;font-size:13px;opacity:.6}
.island{display:flex;gap:8px;overflow-x:auto;padding:6px 0}
.island .ipB{flex:none;width:96px;background:linear-gradient(#bfeaff,#ffe9b3);border-radius:16px;padding:4px;text-align:center;font-size:12px;font-weight:900}
.island .bookPet{width:88px}

/* Photo Booth & Playdate Extras */
.boothCard{background:linear-gradient(135deg,#fff5fa,#f3ebff);border:4px solid #ffd1e8;border-radius:24px;padding:12px;margin:8px 0}
.boothStage{position:relative;width:240px;height:240px;margin:0 auto;border-radius:22px;overflow:hidden;box-shadow:0 8px 18px rgba(58,34,48,.14)}
.boothFrames{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.frameChip{padding:8px 12px;border-radius:14px;background:#f5ecf2;font-weight:900;font-size:15px}
.frameChip.on{background:var(--accent2);color:#fff}
.playdateStage{position:relative;height:230px;border-radius:24px;overflow:hidden;margin:8px 0;display:flex;align-items:flex-end;justify-content:space-around;padding:0 12px 14px;box-shadow:inset 0 -28px 0 rgba(0,0,0,.07)}
.pdPet{width:140px;height:140px;cursor:pointer;animation:bob 1.8s ease-in-out infinite}
.pdPet.cheer{animation:jump .6s ease-out}

/* grown-ups */
.gp{text-align:left}
.gp label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800;font-size:16px;padding:10px 0;border-bottom:1px solid #f3e6ee}
.gp select,.gp input[type=text]{padding:8px;border-radius:10px;border:2px solid #ead2e0;font-size:16px;max-width:55%}
.gp .sbtn{background:#f2ecff;border-radius:12px;padding:10px 12px;font-weight:900;font-size:15px;margin:4px 4px 4px 0}
.gp .sbtn.red{background:#ffe1e1;color:#b32020}
.gp h3{margin:16px 0 4px;font-size:18px}
.gp textarea{width:100%;height:80px;border-radius:12px;border:2px solid #ead2e0;font-size:12px;padding:8px}
.gp .pbox{background:#fff7fb;border-radius:14px;padding:6px 12px;margin:8px 0;border:2px solid #f6dce9}
.gp p.tip{font-size:14px;font-weight:600;line-height:1.4;text-align:left;margin:6px 0;opacity:.85}
.sw{position:relative;width:58px;height:34px;flex:none}
.sw input{opacity:0;width:0;height:0}

 if(!S||!S.settings.sound)return; const a=ac(); if(!a)return;
 const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t); if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03);

 const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),ch=b.getChannelData(0);
 for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);

 s.buffer=b;f.type='bandpass';f.frequency.value=freq;g.gain.value=vol;

/* Smart Offline Voice Picker: prefers Enhanced / Premium / Neural English voices on iOS/macOS/desktop */
let cachedVoices=[];
function refreshVoices(){
 if(!('speechSynthesis' in window))return [];
 cachedVoices=speechSynthesis.getVoices()||[];
 return cachedVoices;
}
if('speechSynthesis' in window){refreshVoices();speechSynthesis.onvoiceschanged=refreshVoices}
function bestVoice(){
 const list=(cachedVoices.length?cachedVoices:refreshVoices()).filter(v=>v.localService!==false);
 if(!list.length)return null;
 if(S&&S.settings.voiceURI){
  const chosen=list.find(v=>v.voiceURI===S.settings.voiceURI);
  if(chosen)return chosen;
 }
 const en=list.filter(v=>/^en(-|_|$)/i.test(v.lang));
 const pool=en.length?en:list;
 const score=v=>{
  const n=(v.name+' '+v.voiceURI).toLowerCase();
  let sc=0;
  if(n.includes('premium'))sc+=60;
  if(n.includes('siri'))sc+=40;
  if(/en[-_]us/i.test(v.lang))sc+=12;
  if(n.includes('enhanced'))sc+=50;
  if(n.includes('neural')||n.includes('natural'))sc+=45;
  if(/samantha|ava|allison|nicky|serena|victoria|karen|moira|tessa|aria|jenny/.test(n))sc+=25;
  if(v.localService)sc+=15;
  if(n.includes('compact')||n.includes('fred')||n.includes('albert'))sc-=30;
  return sc;
 };
 return [...pool].sort((a,b)=>score(b)-score(a))[0]||null;
}

let lastSay='',lastSayT=0;
function softenLine(t){let s=String(t);s=s.replace(/^Hi! It's (.+)!$/,'Pip pip! $1 missed you!');s=s.replace(/^(.+?) is hungry!$/,'A tiny tummy is rumbling. Shall we share a snack with $1?');s=s.replace(/^(.+?) wants to play!$/,'$1 has a game idea! Tap play!');s=s.replace(/^(.+?) is sleepy\. Turn off the light!$/,'$1 is getting dreamy. Lights out?');s=s.replace(/^(.+?) needs a bath!$/,'Splish splash! A little bath for $1?');s=s.replace(/^(.+?) is sleeping\.$/,'Shh. $1 is dreaming of cozy clouds.');return s}
function say(t,force=false){
 t=softenLine(t);
 if(!S||!S.settings.voice)return;
 if(!('speechSynthesis' in window))return;
 try{
  const now=Date.now();
  if(!force&&t===lastSay&&now-lastSayT<2800)return;
  lastSay=t;lastSayT=now;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  const v=bestVoice();if(v)u.voice=v;
  const baseRate=isBig()?.96:.85;
  u.rate=S.settings.voiceRate>0?S.settings.voiceRate:baseRate;
  u.pitch=S.settings.voicePitch||1.12;u.volume=.95;if(v)u.lang=v.lang;
  speechSynthesis.speak(u);
 }catch(e){}
}

 body+=`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="url(#bg_${uid})" stroke="${c.dark}" stroke-width="${sw}"/>`;
 // Specular 2.5D forehead sheen

 // Grown-up Personality Signatures (Sparkle / Bouncy / Cozy)
 if(v==='sparkle'){

 }

 // Expressive Face & Eye Tracking
 const ex=rx*.36,ey=cy-ry*(st==='baby'?.07:.19),er=st==='baby'?6.8:Math.max(7,7.8*s);

 const arc=(x,up)=>`<path d="M${x-er} ${ey+(up?3:-1)} Q${x} ${ey+(up?-er*1.1:er*.9)} ${x+er} ${ey+(up?3:-1)}" stroke="${INK}" stroke-width="3.6" fill="none" stroke-linecap="round"/>`;
 const brow=(x,d,ang)=>`<path d="M${x-er*1.1} ${ey-er-(ang==='sad'?(d<0?2:8):(d<0?9:3))} L${x+er*1.1} ${ey-er-(ang==='sad'?(d<0?8:2):(d<0?3:9))}" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`;
 let eyes='',mouth='';
 const smile=`<path d="M${cx-8} ${my-1} Q${cx} ${my+8} ${cx+8} ${my-1}" stroke="${INK}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`;
 const open=`<path d="M${cx-10} ${my-2} Q${cx} ${my+15} ${cx+10} ${my-2}Z" fill="#7a2840" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/><ellipse cx="${cx}" cy="${my+6}" rx="5" ry="3" fill="#ff8fb1"/>`;

 switch(mood){

  case 'sick':eyes=`<path d="M${L-er} ${ey} h${er*2}" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/><path d="M${R-er} ${ey} h${er*2}" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/>`;mouth=wavy;break;
  case 'angry':eyes=eyeN(L)+eyeN(R)+brow(L,-1,'mad')+brow(R,1,'mad');mouth=`<path d="M${cx-7} ${my+4} Q${cx} ${my-1} ${cx+7} ${my+4}" stroke="${INK}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`;break;
  case 'sleep':eyes=arc(L,0)+arc(R,0);mouth=`<ellipse cx="${cx}" cy="${my+2}" rx="3.5" ry="3" fill="#7a2840"/>`;break;
  case 'eat':eyes=arc(L,1)+arc(R,1);mouth=`<ellipse class="chomp" cx="${cx}" cy="${my+3}" rx="9" ry="9" fill="#7a2840" stroke="${INK}" stroke-width="2"/>`;break;
  case 'surprised':eyes=eyeN(L,1.22)+eyeN(R,1.22);mouth=oh;break;
  case 'dizzy':{
   const x=(X)=>`<path d="M${X-er*.8} ${ey-er*.8} L${X+er*.8} ${ey+er*.8} M${X+er*.8} ${ey-er*.8} L${X-er*.8} ${ey+er*.8}" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/>`;

 }

 if(p.species==='sunny')face+=`<path d="M${cx-6.5} ${ey+er*.4} L${cx+6.5} ${ey+er*.4} L${cx} ${ey+er*.4+8.5}Z" fill="#ff9f1c" stroke="#c76e00" stroke-width="1.6" stroke-linejoin="round"/>`;
 const blush=mood==='angry'?'#ff4d4d':'#ff8fb1';
 if(p.freckles)front+=star(L-er*1.7,ey+er+1,3.4,'#ffd23f','#e0a800')+star(R+er*1.7,ey+er+1,3.4,'#ffd23f','#e0a800');
 face=`<ellipse cx="${L-er*.9}" cy="${ey+er+5}" rx="7.5" ry="4.5" fill="${blush}" opacity="${mood==='angry'?.72:.55}"/><ellipse cx="${R+er*.9}" cy="${ey+er+5}" rx="7.5" ry="4.5" fill="${blush}" opacity="${mood==='angry'?.72:.55}"/>`+eyes+mouth+face;

function hatSVG(h,g,ey,er,L,R){
 if(!h)return '';
 const {cx,top,rx}=g;const t=top+4;
 switch(h){
  case 'bow':{const x=cx+rx*.42,y=t+4;return `<path d="M${x} ${y} L${x-18} ${y-12} L${x-18} ${y+12}Z M${x} ${y} L${x+18} ${y-12} L${x+18} ${y+12}Z" fill="#ff4f8b" stroke="#c42d68" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${x}" cy="${y}" r="6" fill="#ff7fab" stroke="#c42d68" stroke-width="2.5"/>`}
  case 'flower':{const x=cx-rx*.42,y=t+4;let s='';for(let i=0;i<5;i++){const a=i*Math.PI*2/5;s+=`<circle cx="${x+Math.cos(a)*9}" cy="${y+Math.sin(a)*9}" r="8" fill="#fff" stroke="#ffb3d1" stroke-width="2"/>`}return s+`<circle cx="${x}" cy="${y}" r="6" fill="#ffd23f"/>`}
  case 'crown':return `<path d="M${cx-24} ${t+4} L${cx-26} ${t-20} L${cx-12} ${t-8} L${cx} ${t-26} L${cx+12} ${t-8} L${cx+26} ${t-20} L${cx+24} ${t+4}Z" fill="#ffd23f" stroke="#c99400" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${cx}" cy="${t-6}" r="4" fill="#ff4f8b"/><circle cx="${cx-14}" cy="${t-2}" r="3" fill="#5fb6f5"/><circle cx="${cx+14}" cy="${t-2}" r="3" fill="#3fcf8e"/>`;
  case 'party':return `<path d="M${cx-17} ${t+6} L${cx} ${t-40} L${cx+17} ${t+6}Z" fill="#7c5cff" stroke="#4d31c4" stroke-width="2.5" stroke-linejoin="round"/><path d="M${cx-11} ${t-10} L${cx+9} ${t-16} M${cx-14} ${t-1} L${cx+14} ${t-6}" stroke="#ffd23f" stroke-width="4"/><circle cx="${cx}" cy="${t-42}" r="7" fill="#ff4f8b"/>`;
  case 'wizard':return `<path d="M${cx-26} ${t+4} Q${cx-8} ${t-30} ${cx+6} ${t-52} Q${cx+8} ${t-20} ${cx+26} ${t+4}Z" fill="#5b3fc9" stroke="#3a2490" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="${cx}" cy="${t+4}" rx="34" ry="8" fill="#5b3fc9" stroke="#3a2490" stroke-width="2.5"/>${star(cx-4,t-16,6,'#ffd23f','#c99400')}${star(cx+10,t-4,4,'#ffd23f','#c99400')}`;
  case 'cap':return `<path d="M${cx-rx*.62} ${t+10} Q${cx} ${t-34} ${cx+rx*.62} ${t+10}Z" fill="#ff6b6b" stroke="#c94545" stroke-width="2.5"/><path d="M${cx+rx*.3} ${t+9} Q${cx+rx*.95} ${t+4} ${cx+rx*1.05} ${t+14} L${cx+rx*.4} ${t+14}Z" fill="#ff6b6b" stroke="#c94545" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${cx}" cy="${t-12}" r="3.5" fill="#fff"/>`;
  case 'beanie':return `<path d="M${cx-rx*.6} ${t+12} Q${cx} ${t-36} ${cx+rx*.6} ${t+12}Z" fill="#18b6a4" stroke="#0e8478" stroke-width="2.5"/><rect x="${cx-rx*.64}" y="${t+4}" width="${rx*1.28}" height="11" rx="5" fill="#fff" stroke="#0e8478" stroke-width="2.5"/><circle cx="${cx}" cy="${t-24}" r="8" fill="#fff" stroke="#0e8478" stroke-width="2"/>`;
  case 'glasses':return star(L,ey,er*1.9,'rgba(255,79,139,.55)','#c42d68')+star(R,ey,er*1.9,'rgba(255,79,139,.55)','#c42d68')+`<path d="M${L+er*1.2} ${ey-2} Q${cx} ${ey-8} ${R-er*1.2} ${ey-2}" stroke="#c42d68" stroke-width="3" fill="none"/>`;
 }
 return '';
}

/* ---------------- Seasonal Room Charm & Extras ---------------- */
function seasonalCharm(d=new Date()){
 const m=d.getMonth()+1,day=d.getDate();
 if(m===10&&day>=20)return '🎃';
 if(m===12&&day>=10)return '🎄';
 if(m===2&&day>=10&&day<=16)return '💝';
 if(m===3||m===4)return '🌸';
 if(m>=6&&m<=8)return '🍧';
 if(m>=9&&m<=11)return '🍂';
 return '❄️';
}

/* Extra 1: Sticker Photo Booth (saves real PNG card offline via HTML5 Canvas) */
const BOOTH_FRAMES=[
 {id:'hearts',n:'💖 Hearts',bg:'#ffd6ea',border:'#ff5fa2',badges:['💖','✨','🌸','💕']},
 {id:'stars',n:'⭐ Starlight',bg:'#e6dcff',border:'#7c5cff',badges:['⭐','🌙','✨','💫']},
 {id:'sunny',n:'🌈 Rainbow',bg:'#fff3c4',border:'#ff9d2e',badges:['🌈','☀️','🍓','🦋']},
 {id:'party',n:'🎉 Party',bg:'#d9f8ec',border:'#18b6a4',badges:['🎉','🎈','🧁','👑']}
];
function openPhotoBooth(){
 const pl=cur(),p=pl&&pl.pet;if(!p)return;
 let frame=BOOTH_FRAMES[0],pose='happy';

 };
 openModal(`<h2>Sticker Photo Booth 📸</h2>
  <div class="boothCard">
   <div class="boothStage" id="boothBox">
    <div id="boothBadges"></div>
    <div id="boothPet" style="width:170px;height:170px;margin:18px auto 0"></div>

   </div>
   <div class="boothFrames" id="bFrames">${BOOTH_FRAMES.map((f,i)=>`<button class="frameChip${i===0?' on':''}" data-fi="${i}">${f.n}</button>`).join('')}</div>
   <div class="boothFrames" id="bPoses">
    <button class="frameChip on" data-pm="happy">😊 Happy</button>
    <button class="frameChip" data-pm="love">😍 Love</button>
    <button class="frameChip" data-pm="surprised">😮 Surprised</button>
   </div>
  </div>
  <div class="row">
   <button class="big green" id="saveCardBtn">💾 Save Picture</button>
   <button class="big alt" onclick="closeModal()">Done</button>
  </div>`);
 render();
 say('Say cheese! Pick a frame and save a picture card of '+(p.name||'your egg')+'!');
 document.querySelectorAll('[data-fi]').forEach(b=>b.onclick=()=>{frame=BOOTH_FRAMES[+b.dataset.fi];document.querySelectorAll('[data-fi]').forEach(x=>x.classList.toggle('on',x===b));SFX.tap();render()});
 document.querySelectorAll('[data-pm]').forEach(b=>b.onclick=()=>{pose=b.dataset.pm;document.querySelectorAll('[data-pm]').forEach(x=>x.classList.toggle('on',x===b));SFX.tap();render()});
 $('#saveCardBtn').onclick=()=>exportPhotoCard(p,frame,pose);
}
function exportPhotoCard(p,frame,pose){
 try{
  const cv=document.createElement('canvas');cv.width=600;cv.height=600;
  const ctx=cv.getContext('2d');
  ctx.fillStyle=frame.bg;ctx.fillRect(0,0,600,600);
  ctx.strokeStyle=frame.border;ctx.lineWidth=24;ctx.strokeRect(12,12,576,576);
  ctx.font='48px sans-serif';ctx.textAlign='center';
  ctx.fillText(frame.badges[0],64,76);ctx.fillText(frame.badges[1],536,76);
  ctx.fillText(frame.badges[2],64,530);ctx.fillText(frame.badges[3],536,530);
  const svgStr=petSVG(p,pose);
  const blob=new Blob([svgStr],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const img=new Image();
  img.onload=()=>{
   ctx.drawImage(img,125,95,350,350);
   URL.revokeObjectURL(url);
   ctx.fillStyle='#3a2230';ctx.font='900 34px sans-serif';
   ctx.fillText((p.stage==='egg'?'Mystery Egg':p.name)+' • Pip Pals',300,515);
   const a=document.createElement('a');
   a.download=(p.name||'pip-pal')+'-card.png';
   a.href=cv.toDataURL('image/png');
   a.click();
   SFX.yay();toast('Picture card saved! 📸');say('Picture card saved!');
  };
  img.src=url;
 }catch(e){toast('Tap screenshot to save your card! 📸')}
}

/* ---------------- simulation ---------------- */
let LIVE=false; const EVQ=[];
function ev(e){if(LIVE)EVQ.push(e)}
function isNight(h){const {bed,wake}=S.settings;return bed>wake?(h>=bed||h<wake):(h>=bed&&h<wake)}
function stepMin(p,t){
 const night=isNight(new Date(t).getHours()),baby=p.stage==='baby'?1.4:1;
 if(night&&p.asleep!=='night'){p.asleep='night';ev('sleep')}
 if(!night&&p.asleep==='night'){p.asleep=null;p.lights=true;p.litMiss=false;p.nightLit=0;ev('wake')}
 if(p.asleep){
  p.hunger-=.05*baby;p.happy-=.03;p.energy+=p.asleep==='nap'?2.5:.6;
  if(p.asleep==='nap'&&p.energy>=100){p.asleep=null;p.lights=true;ev('wake')}
  if(p.asleep==='night'&&p.lights){p.nightLit++;if(p.nightLit===30&&!p.litMiss){p.careMiss++;p.litMiss=true}}
 }else{
  p.hunger-=.22*baby;p.happy-=.18*baby;p.energy-=.1;
  if(--p.poopIn<=0){if(p.poops.length<4){p.poops.push(rand(8,80));ev('poop')}p.poopIn=rand(120,180)}
  if(p.energy<=0){p.asleep='nap';ev('collapse')}
 }
 p.clean-=.05+.12*p.poops.length;
 if(!p.sick){
  const pr=.0015*p.poops.length+((p.hunger<10||p.clean<10)?.002:0);
  if(Math.random()<pr){p.sick='cold';p.sickMin=0;p.dose=0;ev('sick')}
  p.health+=.1;
 }else{p.sickMin++;p.health-=.12;p.happy-=.05;if(p.sickMin===90)p.careMiss++}
 if(p.tantrum){if(++p.tantrum>20){p.tantrum=0;p.careMiss++}}
 else if(!p.asleep&&!p.sick&&p.stage!=='baby'&&p.happy>30&&Math.random()<1/300){p.tantrum=1;ev('tantrum')}
 for(const k of['hunger','happy','clean','energy'])p[k]=clamp(p[k]);
 p.health=clamp(p.health,5,100);
 for(const k of['hunger','happy','clean','energy']){if(p[k]<10){p.low[k]=(p.low[k]||0)+1;if(p.low[k]===20)p.careMiss++}else if(p[k]>30)p.low[k]=0}
 p.ageMin+=S.settings.speed;
 if(p.stage==='adult')p.adultMin+=S.settings.speed;
 checkGrow(p);
}
function simulate(p,now){
 if(!p)return;
 if(!Number.isFinite(p.lastTick)||p.lastTick>now){p.lastTick=now;return}
 if(p.stage==='egg'||S.settings.paused){p.lastTick=now;return}
 const mins=Math.min(4320,Math.floor((now-p.lastTick)/MIN));
 if(mins<=0)return;
 const normal=Math.min(mins,180);
 for(let i=1;i<=normal;i++)stepMin(p,p.lastTick+i*MIN);
 const rest=mins-normal;
 if(rest>0){
  p.ageMin+=rest*S.settings.speed;
  if(p.stage==='adult')p.adultMin+=rest*S.settings.speed;
  p.hunger=Math.max(30,clamp(p.hunger));p.happy=Math.max(30,clamp(p.happy));
  p.clean=Math.max(40,clamp(p.clean));p.energy=Math.max(50,clamp(p.energy));
  p.health=Math.max(65,clamp(p.health,5,100));
  p.tantrum=0;p.poops=(p.poops||[]).slice(0,1);
  if(p.asleep==='nap')p.asleep=null;
  for(let i=0;i<3;i++)checkGrow(p);
 }
 if(p.asleep==='night'&&!isNight(new Date(now).getHours())){p.asleep=null;p.lights=true}
 p.lastTick=now;
}
function checkGrow(p){
 let next=null;
 if(p.stage==='baby'&&p.ageMin>=GROW.kid)next='kid';
 else if(p.stage==='kid'&&p.ageMin>=GROW.teen)next='teen';
 else if(p.stage==='teen'&&p.ageMin>=GROW.adult)next='adult';
 if(!next)return;
 p.stage=next;
 if(next==='adult'){p.variant=(p.careMiss<=2&&p.manners>=1)?'sparkle':(p.playCount+p.snackCount>=15)?'bouncy':'cozy'}
 p.evolved=next;
}
const formKey=p=>p.species+':'+(p.stage==='adult'?p.variant:p.stage);
const formName=p=>SP[p.species].names[p.stage==='adult'?p.variant:p.stage]||'';
function needsOf(p){
 const n=[];if(!p||p.stage==='egg')return n;
 if(p.sick)n.push('sick');
 if(p.tantrum)n.push('tantrum');
 if(p.asleep)return n;
 if(p.poops.length)n.push('poop');
 if(p.hunger<25)n.push('hungry');
 if(p.energy<20)n.push('sleepy');
 if(p.happy<25)n.push('bored');
 if(p.clean<25&&!p.poops.length)n.push('dirty');
 return n;
}
const NEED={
 sick:['🤒','needs a gentle checkup! Tap the doctor!'],
 tantrum:['😤','is feeling grumpy. Tap Teach Manners!'],
 poop:['💩','made a messy poop! Tap it to clean!'],
 hungry:['🍎','tummy is rumbling! Time for a snack!'],
 sleepy:['💤','is yawning! Turn off the light for bed!'],
 bored:['🎾','wants to play with you!'],
 dirty:['🛁','is ready for a bubbly bath!']
};
let tempMood=null,tempLook=0;
function moodOf(p){
 if(!p)return 'normal';
 if(tempMood&&Date.now()<tempMood.until)return tempMood.m;
 if(p.asleep)return 'sleep';
 if(p.sick)return 'sick';
 if(p.tantrum)return 'angry';
 const m=Math.min(p.hunger,p.happy,p.clean,p.energy);
 if(m<20)return 'sad';
 if(p.happy>75&&m>45)return 'happy';
 return 'normal';
}

function feed(k){
 const pl=cur(),p=pl.pet,f=FOODS[k];
 if(p.tantrum){anim('shake',500);setMood('angry',1200);speak('No! 😤');say(`${p.name} is feeling grumpy. Tap Teach Manners!`);return}
 if(p.hunger>=96&&!f.snack){anim('shake',500);speak("I'm full! 😋");say(`${p.name} is full!`);return}
 if(!f.free){if(!(pl.food[k]>0))return;pl.food[k]--}
 busy=true;setMood('eat',2100);
 const fd=document.createElement('div');fd.className='deco';fd.style.cssText='font-size:46px;z-index:7;transition:transform .3s';fd.textContent=f.e;
 const pp=petPos();fd.style.left=(pp.x+9)+'%';fd.style.top=(pp.top+2)+'%';$('#fx').appendChild(fd);
 [0,600,1200].forEach((t,i)=>setTimeout(()=>{SFX.chomp();fd.style.transform=`scale(${1-.3*(i+1)})`;fx('·',pp.x+rand(-6,6),pp.top+12)},t));
 setTimeout(()=>{fd.remove();busy=false;
  const wasFull=p.hunger>=85;
  p.hunger=clamp(p.hunger+f.h);p.happy=clamp(p.happy+f.j);p.weight+=f.w;trailMark('care');
  if(p.poopIn>45)p.poopIn=rand(25,45);
  if(f.snack){p.snackCount++;const now=Date.now();p.snackTimes=(p.snackTimes||[]).filter(t=>now-t<30*MIN);p.snackTimes.push(now);
   if(p.snackTimes.length>=3&&!p.sick){p.sick='tummy';p.sickMin=0;p.dose=0;p.snackTimes=[];setMood('sick',1500);speak('Tummy ache! 🤢');say(`Too many treats! ${p.name} has a tummy ache. Time for the doctor.`);save();updateGame();return}}
  setMood('happy',1500);
  if(wasFull&&f.h>=25){SFX.burp();speak('Excuse me! 🤭')}
  else{SFX.chirp();speak(pick(['Yummy! 😋','Mmm!','Nom nom!','Delicious!']))}
  save();updateGame()},1900);
}

function openShop(tab){
 const pl=cur();
 const T={food:'🍓 Treats',toys:'⚽ Toys',hats:'🎀 Hats',rooms:'🏠 Rooms'};
 let items='';
 if(tab==='food')items=Object.entries(FOODS).filter(([k,f])=>!f.free).map(([k,f])=>`<button class="item" data-b="food:${k}">${pl.food[k]?`<span class="cnt">${pl.food[k]}</span>`:''}<div class="e">${f.e}</div><div class="n">${f.n}</div><div class="pr">🪙 ${f.p}</div></button>`).join('');
 if(tab==='toys')items=Object.entries(TOYS).map(([k,f])=>{const o=pl.toys.includes(k);return `<button class="item${o?' owned':''}" data-b="toys:${k}"><div class="e">${f.e}</div><div class="n">${f.n}</div><div class="pr">${o?'✅ Yours':'🪙 '+f.p}</div></button>`}).join('');
 if(tab==='hats')items=Object.entries(HATS).map(([k,f])=>{const o=pl.hats.includes(k);return `<button class="item${o?' owned':''}" data-b="hats:${k}">${hatPreview(k)}<div class="n">${f.n}</div><div class="pr">${o?'✅ Yours':'🪙 '+f.p}</div></button>`}).join('');
 if(tab==='rooms')items=Object.entries(ROOMS).map(([k,f])=>{const o=pl.rooms.includes(k);return `<button class="item roomT${o?' owned':''}" data-b="rooms:${k}" style="background:${f.sky}"><div class="e">${f.e}</div><div class="n">${f.n}</div><div class="pr">${o?'✅ Yours':'🪙 '+f.p}</div></button>`}).join('');
 openSheet(`Shop · 🪙 ${pl.coins}`,`<div class="tabs">${Object.entries(T).map(([k,n])=>`<button class="tab${k===tab?' on':''}" data-tab="${k}">${n}</button>`).join('')}</div><div class="grid">${items}</div><p style="text-align:center;font-weight:800;opacity:.7">Earn coins by playing games and taking good care! 🪙</p>`);
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{SFX.tap();openShop(b.dataset.tab)});
 document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>buy(...b.dataset.b.split(':'),tab));

function hatPreview(k){const p=cur().pet;if(!p||p.stage==='egg')return `<div class="e">${HATS[k].e}</div>`;return petSVG(Object.assign({},p,{hat:k}),'happy')}
function buy(type,k,tab){
 const pl=cur();const list={food:FOODS,toys:TOYS,hats:HATS,rooms:ROOMS}[type];const it=list[k];
 if(type!=='food'&&pl[type].includes(k)){if(type==='hats'||type==='rooms'){closeSheet();equip(type,k)}return}
 if(pl.coins<it.p){SFX.oops();toast(`You need ${it.p-pl.coins} more coins 🪙`);say(`You need ${it.p-pl.coins} more coins. Play games to earn coins!`);return}
 pl.coins-=it.p;SFX.coin();
 if(type==='food')pl.food[k]=(pl.food[k]||0)+1;else pl[type].push(k);
 save();$('#coins').textContent=pl.coins;say(`You got the ${it.n}!`);
 if(type==='hats'||type==='rooms'){closeSheet();equip(type,k)}else openShop(tab);
}

 MG.timers.forEach(t=>{clearTimeout(t);clearInterval(t)});MG.timers=[];cancelAnimationFrame(MG.raf);MG.on=false;
 $('#mg').classList.remove('on');$('#mg').innerHTML='';
 if(!res){updateGame();return}
 const p=cur().pet;p.happy=clamp(p.happy+res.happy);p.energy=clamp(p.energy-res.energy);p.playCount++;p.weight=Math.max(3,p.weight-1);
 cur().coins+=res.coins;trailMark('game');save();updateGame();SFX.yay();
 openModal(`<div class="mBig">${petSVG(p,'happy')}</div><h2>${res.title}</h2><p style="font-size:28px">🪙 +${res.coins}</p><p>${esc(p.name)} had fun! 😊</p><button class="big green" onclick="closeModal()">OK!</button>`);
 say(`${res.title} You earned ${res.coins} coins!`,true);
}
function startGame(g){

 if(p.energy<12){SFX.yawn();speak('Too sleepy... 😴');say(`${p.name} is too sleepy to play. Turn off the light for a nap.`);return}
 if(p.tantrum){anim('shake',500);speak('Hmph! 😤');say('Teach manners first!');return}
 ({lr:mgLR,catch:mgCatch,bubble:mgBubble,math:mgMath,pattern:mgPattern})[g]();

  mgT(()=>{const w=pd===d;res.push(w?'💖':'❌');if(w){score++;draw('happy',pd);SFX.yay();$('#lrMsg').textContent='Yes! 🎉'}else{draw('surprised',pd);SFX.oops();$('#lrMsg').textContent='Oops! 🙈'}

function mgCatch(){
 const p=cur().pet,a=mgShell('Treat Catch 🍓');let score=0,x=50,tx=50;const DUR=25000,t0=Date.now();
 a.style.background='linear-gradient(#bfe9ff,#fff3fa)';
 a.innerHTML=`<div class="timer"><div id="tbar"></div></div><div class="catcher" id="cat">${petSVG(p,'happy')}</div>`;
 const items=[];const W=()=>a.clientWidth,H=()=>a.clientHeight;
 const setT=e=>{const r=a.getBoundingClientRect();tx=clamp((e.clientX-r.left)/r.width*100,8,92)};
 a.addEventListener('pointerdown',setT);a.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||e.buttons)setT(e)});
 mgI(()=>{const bad=Math.random()<.22,gold=!bad&&Math.random()<.1;const d=document.createElement('div');d.className='fall';d.textContent=bad?'⛈️':gold?'⭐':pick(['🍓','🍎','🍪','🍬','🍇','🧁']);a.appendChild(d);items.push({d,x:rand(8,92),y:-6,v:(rand(18,30)+(Date.now()-t0)/2500)*(isBig()?1.35:1),bad,gold})},650);
 let last=performance.now(),cm=null;
 const loop=now=>{const dt=Math.min(.05,(now-last)/1000);last=now;x+=(tx-x)*Math.min(1,dt*10);$('#cat').style.left=x+'%';
  for(let i=items.length-1;i>=0;i--){const it=items[i];it.y+=it.v*dt;it.d.style.left=it.x+'%';it.d.style.top=it.y+'%';
   const catchY=100-(120/H()*100)*.75;
   if(it.y>=catchY&&it.y<=catchY+10&&Math.abs(it.x-x)<(60/W()*100)+4){it.d.remove();items.splice(i,1);
    if(it.bad){score=Math.max(0,score-1);SFX.oops();$('#cat').innerHTML=petSVG(p,'dizzy');clearTimeout(cm);cm=setTimeout(()=>$('#cat').innerHTML=petSVG(p,'happy'),700)}
    else{score+=it.gold?3:1;SFX.chomp();$('#cat').innerHTML=petSVG(p,'eat');clearTimeout(cm);cm=setTimeout(()=>$('#cat').innerHTML=petSVG(p,'happy'),400)}
    $('#mgScore').textContent='⭐ '+score;continue}
   if(it.y>108){it.d.remove();items.splice(i,1)}}
  const left=1-(Date.now()-t0)/DUR;$('#tbar').style.width=Math.max(0,left*100)+'%';
  if(left<=0){clearTimeout(cm);return endMG({title:score>=10?'Super catcher! 🏆':'Yummy! 😋',coins:Math.min(15,Math.ceil(score/2)+1),happy:18,energy:10})}
  MG.raf=requestAnimationFrame(loop)};
 MG.raf=requestAnimationFrame(loop);
 say(`Move ${p.name} to catch the treats! Watch out for rain clouds!`);
}

function mgPattern(){
 const pl=cur(),a=mgShell('Pattern Parade 🧩');let round=0,score=0,lock=false;
 const advanced=['times','big'].includes(pl.math),N=6;
 a.innerHTML='<div class="questHead" style="margin:12px"><strong>🧩 What comes next?</strong><span>Follow the picture pattern!</span></div><div class="patternSeq" id="patternSeq"></div><div class="patternMsg" id="patternMsg"></div><div class="patternChoices" id="patternChoices"></div><div class="dots" id="patternDots"></div>';
 const alphabet=['🍓','🦋','⭐','🌈','🌼','💎','🧁','🍀','🌙','🐚'];
 const shuffled=()=>[...alphabet].sort(()=>Math.random()-.5);
 const shapes=advanced?['AB','ABC','AABB','ABBA']:['AB','AAB','ABB','ABC'];
 const next=()=>{
  if(round>=N)return endMG({title:score>=4?'Pattern champion! 🏆':'Wonderful exploring! 🌟',coins:3+score*2,happy:17,energy:6});
  lock=false;const type=pick(shapes),set=shuffled(),used=set.slice(0,type==='ABC'?3:2),order=[...type].map(c=>used[c.charCodeAt(0)-65]);
  const display=Array.from({length:advanced?7:5},(_,i)=>order[i%order.length]),ans=order[display.length%order.length];
  const options=[ans,...shuffled().filter(e=>e!==ans).slice(0,2)].sort(()=>Math.random()-.5);
  $('#patternSeq').innerHTML=display.map(e=>`<span>${e}</span>`).join('')+'<span class="unknown">?</span>';
  $('#patternChoices').innerHTML=options.map(e=>`<button data-answer="${e}" aria-label="${e}">${e}</button>`).join('');
  $('#patternDots').textContent=Array.from({length:N},(_,i)=>i<round?'⭐':'◯').join(' ');
  $('#patternMsg').textContent='👆 👀';say('Look at the pattern. What picture comes next?');
  $('#patternChoices').querySelectorAll('button').forEach(b=>b.onclick=()=>{
   if(lock||!MG.on)return;lock=true;
   if(b.dataset.answer===ans){score++;b.classList.add('correct');$('#patternMsg').textContent='⭐ Great pattern!';SFX.yay();say('You found it! Great pattern!')}
   else{b.classList.add('wrong');$('#patternMsg').textContent='💖 Nice try!';SFX.oops();say('Nice try! Here is the next picture.');const ok=[...$('#patternChoices').children].find(x=>x.dataset.answer===ans);if(ok)ok.classList.add('correct')}
   $('#mgScore').textContent='⭐ '+score;round++;mgT(next,1200);
  });
 };
 next();
}

const MATH_LV={count:'Counting 1–10',add10:'Adding to 10',add20:'Adding to 20',times:'Times tables',big:'2-digit × 2-digit'};
function mathQ(lv){
 const E=pick(['🍓','🍎','🫐','🍪','⭐','🧁']);
 if(lv==='count'){const n=rand(1,10);return{n,say:`How many? Count them!`,q:'How many?',pics:Array(n).fill(E).join(''),ans:n,sayAns:true}}
 if(lv==='add10'){const a=rand(1,6),b=rand(1,10-a);return{q:`${a} + ${b}`,say:`${a} plus ${b}`,pics:`${E.repeat(a)}<span class="plus">+</span>${E.repeat(b)}`,ans:a+b,sayAns:true}}
 if(lv==='add20'){const a=rand(4,12),b=rand(2,20-a);return{q:`${a} + ${b}`,say:`${a} plus ${b}`,pics:'',ans:a+b,sayAns:true}}
 if(lv==='times'){const a=rand(2,10),b=rand(2,10);return{q:`${a} × ${b}`,pics:'',ans:a*b,m:[a,b]}}
 const a=rand(11,29),b=rand(11,19);return{q:`${a} × ${b}`,pics:'',ans:a*b,m:[a,b]};
}
function distract(q){const s=new Set([q.ans]);const c=q.m?[q.ans+q.m[0],q.ans-q.m[0],q.ans+q.m[1],q.ans-q.m[1],q.ans+10,q.ans-10]:[q.ans+1,q.ans-1,q.ans+2,q.ans-2];
 for(const v of c.sort(()=>Math.random()-.5)){if(s.size>=3)break;if(v>0)s.add(v)}while(s.size<3)s.add(q.ans+s.size+1);return [...s].sort(()=>Math.random()-.5)}
function areaHint(a,b){
 const at=Math.floor(a/10)*10,ao=a%10,bt=Math.floor(b/10)*10,bo=b%10;
 if(a<10||b<10){const big=Math.max(a,b),sm=Math.min(a,b);if(big<10)return `${a} × ${b}: count ${sm} groups of ${big}`;const t=Math.floor(big/10)*10,o=big%10;return `${t} × ${sm} = ${t*sm}<br>${o} × ${sm} = ${o*sm}<br><b>${t*sm} + ${o*sm}</b>`}
 const cells=[[at,bt],[at,bo],[ao,bt],[ao,bo]].filter(([x,y])=>x&&y);
 return `<table class="area"><tr><td style="border:0;background:none"></td><th>${bt}</th>${bo?`<th>${bo}</th>`:''}</tr><tr><th>${at}</th><td>${at*bt}</td>${bo?`<td>${at*bo}</td>`:''}</tr>${ao?`<tr><th>${ao}</th><td>${ao*bt}</td>${bo?`<td>${ao*bo}</td>`:''}</tr>`:''}</table><div>Add the boxes: ${cells.map(([x,y])=>x*y).join(' + ')}</div>`;
}
function mathTools(q){return `<div class="mtRow"><button class="mtB" id="mHint">💡 Area model hint</button><button class="mtB" id="mPadB">✏️ Scratchpad</button></div><div class="hintBox" id="mHintBox" style="display:none">${areaHint(q.m[0],q.m[1])}</div><div id="mPadWrap" style="display:none"><canvas id="mPad"></canvas><button class="mtB" id="mPadClr">🧽 Clear</button></div>`}
let padOpen=false;
function bindMathTools(q){
 $('#mHint').onclick=()=>{SFX.tap();const h=$('#mHintBox');h.style.display=h.style.display==='none'?'block':'none'};
 const show=()=>{$('#mPadWrap').style.display=padOpen?'block':'none';if(padOpen)setupPad()};
 $('#mPadB').onclick=()=>{SFX.tap();padOpen=!padOpen;show()};show();
}
function setupPad(){
 const c=$('#mPad');if(!c)return;const r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;
 const x=c.getContext('2d');x.scale(dpr,dpr);x.lineWidth=3.5;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#5b3fc9';
 let down=false,lx=0,ly=0;const pos=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
 c.onpointerdown=e=>{down=true;[lx,ly]=pos(e);c.setPointerCapture&&c.setPointerCapture(e.pointerId)};
 c.onpointermove=e=>{if(!down)return;const[nx,ny]=pos(e);x.beginPath();x.moveTo(lx,ly);x.lineTo(nx,ny);x.stroke();lx=nx;ly=ny};
 c.onpointerup=c.onpointercancel=()=>down=false;
 $('#mPadClr').onclick=()=>{x.clearRect(0,0,c.width,c.height);SFX.tap()};
}
function mgMath(){
 const pl=cur(),p=pl.pet,a=mgShell('Snack Math 🔢');let i=0,score=0,lock=false;const N=6;
 a.innerHTML=`<div style="padding:10px 10px 0"><div class="mathPet" id="mPet">${petSVG(p,'happy')}</div><div class="mathPics" id="mPics"></div><div class="mathQ" id="mQ"></div><div class="mathOpts" id="mOpts"></div><div id="mTools"></div><div class="dots" id="mDots"></div><p style="text-align:center;font-weight:800;opacity:.6;font-size:14px">${MATH_LV[pl.math]}</p></div>`;
 const next=()=>{if(i>=N)return endMG({title:score>=5?'Math star! 🌟':'Nice work! 😊',coins:score+2,happy:15,energy:5});
  const q=mathQ(pl.math);lock=false;$('#mPet').innerHTML=petSVG(p,'normal');$('#mPics').innerHTML=q.pics;$('#mQ').textContent=q.q;$('#mDots').textContent=`${i+1} / ${N}`;
  $('#mOpts').innerHTML=distract(q).map(v=>`<button data-v="${v}">${v}</button>`).join('');
  $('#mTools').innerHTML=q.m?mathTools(q):'';if(q.m)bindMathTools(q);
  if(q.say)say(q.say);
  $('#mOpts').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(lock)return;lock=true;const v=+b.dataset.v;
   if(v===q.ans){b.classList.add('ok');score++;SFX.chomp();$('#mPet').innerHTML=petSVG(p,'eat');$('#mgScore').textContent='⭐ '+score;if(q.sayAns)say(`${q.ans}! Yummy!`);else say('Yes!');mgT(()=>{$('#mPet').innerHTML=petSVG(p,'happy');SFX.yay()},700)}
   else{b.classList.add('bad');SFX.oops();$('#mPet').innerHTML=petSVG(p,'surprised');$('#mOpts').querySelector(`[data-v="${q.ans}"]`).classList.add('ok');say(`It's ${q.ans}.`)}
   i++;mgT(next,1700)})};
 next();
}

 $('#pTestBtn').onclick=()=>{ac();upd();const p=cur()&&cur().pet;petVoice(p?p.species:'mochi',p&&p.stage!=='egg'?p.stage:'kid','happy')};
 $('#sTalk').onchange=e=>{st.talk=e.target.checked;save();toast(st.talk?(SR?'Talking on 🎤':'Talking not supported on this device — picture tricks will show'):'Talking off')};
 $('#s3d').onchange=e=>{st.no3d=!e.target.checked;save();if(st.no3d)disable3D();else enable3D();toast(st.no3d?'Flat pets on':'3D pets on ✨')};
 $('#sPause').onchange=e=>{st.paused=e.target.checked;if(!st.paused)S.players.forEach(pl=>{if(pl.pet)pl.pet.lastTick=Date.now()});save();toast(st.paused?'Pets paused 🏫':'Pets are back! 💖')};
 document.querySelectorAll('[data-pn]').forEach(i=>i.onchange=()=>{const pl=S.players.find(x=>x.id===i.dataset.pn);pl.name=i.value.trim()||pl.name;save()});
 document.querySelectorAll('[data-pm]').forEach(i=>i.onchange=()=>{S.players.find(x=>x.id===i.dataset.pm).math=i.value;save()});
 document.querySelectorAll('[data-pmode]').forEach(i=>i.onchange=()=>{S.players.find(x=>x.id===i.dataset.pmode).mode=i.value;save()});
 document.querySelectorAll('[data-gift]').forEach(b=>b.onclick=()=>{S.players.find(x=>x.id===b.dataset.gift).coins+=20;save();SFX.coin();toast('20 coins given 🪙')});
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirmTwice(b)){S.players=S.players.filter(x=>x.id!==b.dataset.del);save();grownPanel()}});
 $('#bkCopy').onclick=()=>{const t=btoa(unescape(encodeURIComponent(JSON.stringify(S))));$('#bkTxt').value=t;$('#bkTxt').select();try{navigator.clipboard.writeText(t).then(()=>toast('Backup copied'),()=>toast('Select and copy the code'))}catch(e){toast('Select and copy the code')}};
 $('#bkLoad').onclick=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob($('#bkTxt').value.trim()))));if(!Array.isArray(o.players)||o.players.length>4||!o.players.every(x=>x&&typeof x.name==='string'&&typeof x.coins==='number'&&x.coins>=0&&x.coins<1e8&&(!x.pet||Object.prototype.hasOwnProperty.call(SP,x.pet.species))))throw 0;const pin=S.settings.pin;S=o;S.settings=Object.assign(defSettings(),S.settings||{});if(!S.settings.pin)S.settings.pin=pin;S.players=S.players.slice(0,4);S.active=null;save();toast('Backup loaded ✅');closeModal();show('home');renderHome()}catch(e){toast('That backup code did not work')}};
 $('#pinChg').onclick=setPin;
 $('#resetAll').onclick=()=>{if(confirmTwice($('#resetAll'))){localStorage.removeItem(KEY);load();closeModal();show('home');renderHome();toast('Everything reset')}};
}
function confirmTwice(b){
 if(b.dataset.ok==='1')return true;
 b.dataset.ok='1';const old=b.textContent;b.textContent='Tap again to confirm';
 setTimeout(()=>{if(b){b.dataset.ok='';b.textContent=old}},3000);
 return false;
}

$('#homeBtn').onclick=()=>{ac();SFX.tap();closeSheet();show('home');renderHome()};
load();
renderHome();
wander();
